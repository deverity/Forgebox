[package]
name = "forge-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox API contracts: JSON-RPC 2.0 types, transport abstraction, event streams and client."
publish = false

[lints]
workspace = true

[dependencies]
# `specta` derives TS types for the IDs and payloads defined in forge-core.
forge-core = { path = "../forge-core", features = ["specta"] }
anyhow = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
