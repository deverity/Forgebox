[package]
name = "forge-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox API contracts: JSON-RPC 2.0 types, transport abstraction, event streams and client."
publish = false

[lints]
workspace = true

[dependencies]
# `specta` derives TS types for the IDs defined in forge-core (RequestId...).
forge-core = { path = "../forge-core", features = ["specta"] }
serde = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-typescript = { workspace = true }
specta-serde = { workspace = true }
ulid = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
