[package]
name = "forge-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox process supervisor: Job Objects, stdio capture, health probes and restart policies."
publish = false

[lints]
workspace = true

# Internal helper of forgeboxd that delivers CTRL_BREAK to a supervised process' console
# (docs/03 §1.3, ADR-0016). Ships next to forgeboxd.exe (docs/08 §2).
[[bin]]
name = "forgebox-ctrl"
path = "src/bin/forgebox-ctrl.rs"

[dependencies]
forge-core = { path = "../forge-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
