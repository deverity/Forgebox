[package]
name = "forge-fcgi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox PHP FastCGI pool manager: one pool per PHP version, ports, workers and blue/green swap."
publish = false

[lints]
workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-supervisor = { path = "../forge-supervisor" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Contract test of the pool.* payloads (tests/pool_payload_contract.rs); forge-ipc does not
# depend on forge-fcgi, so there is no cycle.
forge-ipc = { path = "../forge-ipc" }
pretty_assertions = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
