[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox domain base: IDs, errors, events, actors, jobs, SQLite store, runtime, paths and platform traits."
publish = false

[lints]
workspace = true

[features]
default = []
# Derives `specta::Type` for API-facing types (IDs). Enabled by forge-ipc so that
# `cargo xtask gen-ts` can export them; domain crates do not need it.
specta = ["dep:specta", "specta/ulid", "specta/jiff"]
# tokio-console instrumentation for development (`runtime::init_console`). Requires
# RUSTFLAGS="--cfg tokio_unstable"; the default build does not.
console = ["dep:console-subscriber"]

[dependencies]
console-subscriber = { workspace = true, optional = true }
futures = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

# Win32 only behind `platform::windows` (CLAUDE.md). `junction` wraps
# CreateFile + FSCTL_SET_REPARSE_POINT; `windows` gives NtSetInformationFile.
[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
windows = { workspace = true, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
