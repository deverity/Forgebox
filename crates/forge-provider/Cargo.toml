[package]
name = "forge-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox download providers, sha256 verification, extraction and versioned layout with current junction."
publish = false

[lints]
workspace = true

[dependencies]
forge-registry = { path = "../forge-registry" }
forge-core = { path = "../forge-core" }
forge-manifest = { path = "../forge-manifest" }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
lzma-rust2 = { workspace = true }
minisign-verify = { workspace = true }
pgp = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sevenz-rust2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
# The xz encoder builds tar.xz fixtures in tests.
lzma-rust2 = { workspace = true, features = ["encoder"] }
minisign = { workspace = true }
rand = { workspace = true }
# The 7z writer (malicious fixtures are generated by the tests, not committed).
sevenz-rust2 = { workspace = true, features = ["compress"] }
tempfile = { workspace = true }
