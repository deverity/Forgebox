[package]
name = "forge-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Forgebox networking: port allocation, *.test DNS server, NRPT/hosts policy and firewall."
publish = false

[lints]
workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
async-trait = { workspace = true }
hickory-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# CancellationToken of the hickory server (same tokio-util as hickory-server).
tokio-util = { workspace = true }
tracing = { workspace = true }
# Random probe names of the NRPT verification (forgebox-probe-<ulid>.test, ADR-0033).
ulid = { workspace = true }

[dev-dependencies]
# Contract test only: dns.policy_applied / helper.op payloads match forge_ipc::api::events.
forge-ipc = { path = "../forge-ipc" }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
