# yaml-language-server: $schema=../schema/stack.v1.json
# docs/12 section 6 documents this choice: no "latest.zip" (not sha256-verified inside create_with)
# and no WP-CLI yet (M3-E1). The core comes from Composer (johnpbloch/wordpress), installed in
# `<dir>/wordpress/` (wordpress-install-dir), which is the site root for the driver. Integrity
# comes from HTTPS plus the pinned reference commit; Packagist publishes no dist hash
# (`shasum: ''` for johnpbloch/wordpress and wordpress-core). wp-config.php is
# generated by the `wordpress` driver (forge-sites) from the env_patch values.
apiVersion: forgebox.dev/v1
kind: Stack
metadata:
  id: wordpress
  name: WordPress
  summary: "PHP 8.3 + Apache + MariaDB 11.8 + Mailpit"
  description: |
    WordPress com Apache (suporta `.htaccess`), MariaDB e Mailpit para capturar os e-mails do site.
  tags: [php, wordpress, mariadb, cms]
  icon: wordpress.svg
  homepage: https://wordpress.org
spec:
  tools:
    - { id: php, series: "8.3" }
    - { id: composer }
    - { id: apache }
    - { id: mariadb, series: "11.8", instance: default }
    - { id: mailpit, instance: default }
  site:
    create_with: "composer create-project johnpbloch/wordpress {{ dir }}"
    driver: wordpress
    php: "8.3"
    secure: true
    env_patch:
      DB_HOST: "127.0.0.1:{{ instances.mariadb.default.ports.main }}"
      DB_NAME: "{{ site.slug }}"
      DB_USER: root
      DB_PASSWORD: ""
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "{{ instances.mailpit.default.ports.smtp }}"
    post_create:
      - create_database: { instance: mariadb/default, name: "{{ site.slug }}" }
