# yaml-language-server: $schema=../schema/tool.v1.json
# verified: 2026-10-26 8.4.27-1 nts-vs17-x64 dbae154a0a89791f36c3d48e68bae797878333e7d6cb5721e74617de59b63ab7
#   (releases.json of downloads.php.net == sha256 of the zip downloaded and hashed locally)
# Upstream publishes sha256 in releases.json, so no `releases:` list is needed. Note: the provider
# reports builds like "8.4.27-1" (packaging revision); it normalizes them before matching channels.
apiVersion: forgebox.dev/v1
kind: Tool

metadata:
  id: php
  name: PHP
  summary: Linguagem PHP (builds oficiais Windows)
  description: |
    PHP com builds oficiais de windows.php.net. Várias versões lado a lado; cada site escolhe a sua
    por pool FastCGI (`php-cgi`). NTS é o recomendado para FastCGI.
  category: runtime
  tags: [php, language, fastcgi]
  homepage: https://www.php.net
  docs: https://www.php.net/manual
  license: PHP-3.01
  icon: php.svg
  maintainers: [{ name: Forgebox Team, url: https://github.com/forgebox }]

spec:
  platforms: [windows-x64]
  runtime_deps: [vcredist-vs17]
  suggests: [composer, xdebug]

  versioning:
    scheme: semver
    channels:
      stable: { constraint: ">=7.4 <9" }
      preview: { constraint: ">=8.6.0-0", prerelease: true }
    series_key: "{major}.{minor}"
    variants:
      - key: ts
        values: [nts, ts]
        default: nts
        label: { nts: Non Thread Safe, ts: Thread Safe }
      - key: compiler
        values: [vs17, vs16, vc15]
        derive: from_provider
      - key: arch
        values: [x64]
        default: x64

  source:
    providers:
      - type: php-windows
        include_archives: true
        qa: false

  install:
    archive: zip
    strip_root: auto
    layout: versioned
    current_link: true
    path:
      - "."
    shims: [php, php-cgi, phpdbg, pear, pecl]
    version_files: [".php-version"]   # shims: nearest file in the cwd or above selects the version (docs/06 2.3)
    project_key: spec.site.php        # same from a project forgebox.yaml
    verify:
      command: "php.exe -v"
      regex: "^PHP (\\d+\\.\\d+\\.\\d+)"
    post_install:
      - copy: { from: "php.ini-development", to: "{{ paths.etc }}/php/{{ series }}/php.ini", if_missing: true }
      - render: { template: "php/php.ini.j2", to: "{{ paths.etc }}/php/{{ series }}/conf.d/10-forgebox.ini" }
      - mkdir: "{{ paths.tmp }}/php/{{ series }}/sessions"
      - mkdir: "{{ paths.tmp }}/php/{{ series }}/uploads"
      - mkdir: "{{ paths.logs }}/php/{{ series }}"
    uninstall:
      keep: ["{{ paths.etc }}/php/{{ series }}"]
    size_estimate_mb: 35

  config:
    files:
      - id: php_ini
        path: "{{ paths.etc }}/php/{{ series }}/php.ini"
        format: ini
        label: php.ini
        editable: true
        # Quick settings go to a file Forgebox owns, scanned after php.ini (PHP_INI_SCAN_DIR):
        # the user's php.ini is never edited (docs/04 section 1.3).
        overlay: "{{ paths.etc }}/php/{{ series }}/conf.d/90-forgebox-settings.ini"
    quick_settings:
      - key: memory_limit
        label: Memory limit
        file: php_ini
        ini: "memory_limit"
        type: select
        options: [128M, 256M, 512M, 1G, -1]
        default: 512M
        apply: reload
      - key: upload_max_filesize
        label: Upload max filesize
        file: php_ini
        ini: "upload_max_filesize"
        type: text
        default: 128M
        also_set: { post_max_size: "{{ value }}" }
        apply: reload
      - key: max_execution_time
        label: Max execution time (s)
        file: php_ini
        ini: "max_execution_time"
        type: number
        min: 0
        default: 120
        apply: reload
      - key: display_errors
        label: Display errors
        file: php_ini
        ini: "display_errors"
        type: toggle
        on: "On"
        off: "Off"
        default: on
        apply: reload
      - key: opcache
        label: OPcache
        file: php_ini
        ini: "opcache.enable"
        type: toggle
        on: "1"
        off: "0"
        apply: reload
    extensions:
      source: bundled
      ini_dir: "{{ paths.etc }}/php/{{ series }}/conf.d"
      pattern: "php_{name}.dll"
      defaults_on: [curl, mbstring, openssl, pdo_mysql, pdo_sqlite, pdo_pgsql, fileinfo, gd, intl, zip, sodium, exif, bcmath]
      zend_extensions: [{ name: opcache, constraint: "<8.5" }]  # PHP 8.5+ embeds OPcache
    env:
      PHPRC: "{{ paths.etc }}/php/{{ series }}"
      PHP_INI_SCAN_DIR: "{{ paths.etc }}/php/{{ series }}/conf.d"

  service:
    kind: pool
    pool:
      exe: php-cgi.exe
      args: ["-b", "127.0.0.1:{{ port }}", "-c", "{{ paths.etc }}/php/{{ series }}/php.ini"]
      protocol: fastcgi
      port_range: php-pools
      scaling: { min: 2, max: 12, idle_timeout: 120s }
      recycle: { max_requests: 500, max_rss_mb: 256, max_age: 1h }
      env: { PHP_FCGI_MAX_REQUESTS: "{{ recycle.max_requests }}" }
      health: { fastcgi: "/_forgebox/health.php" }

  discover:
    match_files: [php.exe, php-cgi.exe]
    version_command: "php.exe -r \"echo PHP_VERSION;\""
    variant_detect:
      ts: { command: "php.exe -i", regex: "Thread Safety => (enabled|disabled)", map: { enabled: ts, disabled: nts } }

  update:
    policy: auto-patch
    retention: 1
    check_interval: 6h
    migrate:
      - copy_dir: { from: "ext/", to: "ext/", only_missing: true }

  ui:
    color: "#777BB4"
    actions:
      - { label: "php.ini", icon: file-text, open: config:php_ini }
      - { label: "Terminal com esta versão", icon: terminal, shell: { path_prepend: ["{{ paths.version }}"] } }
      - { label: "Info (phpinfo)", icon: info, browse: "http://localhost/_forgebox/phpinfo?v={{ version }}" }
    badges: ["{{ variant.ts }}", "{{ variant.compiler }}"]
