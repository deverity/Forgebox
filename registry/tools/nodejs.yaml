# yaml-language-server: $schema=../schema/tool.v1.json
# verified: 2026-10-26 22.23.4 cbc74b5e0982c9dbb41525fd8fb5dcd32fbee237863f7829072f4639a1ce5f20
#   (https://nodejs.org/dist/v22.23.4/SHASUMS256.txt, node-v22.23.4-win-x64.zip == local hash)
apiVersion: forgebox.dev/v1
kind: Tool

metadata:
  id: nodejs
  name: Node.js
  summary: Node.js (builds oficiais nodejs.org)
  description: |
    Runtime JavaScript. Várias versões lado a lado; sites e processos escolhem a sua
    (`runtime: nodejs@22`). Inclui npm, npx e corepack.
  category: runtime
  tags: [node, javascript, npm]
  homepage: https://nodejs.org
  docs: https://nodejs.org/docs/latest/api/
  license: MIT
  icon: nodejs.svg
  maintainers: [{ name: Forgebox Team, url: https://github.com/forgebox }]

spec:
  platforms: [windows-x64]
  runtime_deps: [vcredist-vs17]

  versioning:
    scheme: semver
    channels:
      lts: { constraint: "^20 || ^22 || ^24" }
      latest: { constraint: ">=25" }
    series_key: "{major}"

  source:
    providers:
      - type: nodejs-dist
    releases:
      - version: "22.23.4"
        url: https://nodejs.org/dist/v22.23.4/node-v22.23.4-win-x64.zip
        sha256: "cbc74b5e0982c9dbb41525fd8fb5dcd32fbee237863f7829072f4639a1ce5f20"
        size: 35604229
        published_at: 2026-10-20T00:00:00Z

  install:
    archive: zip
    strip_root: auto
    layout: versioned
    current_link: true
    path:
      - "."
    shims: [node, npm, npx, corepack]
    verify:
      command: "node.exe -v"
      regex: "^v(\\d+\\.\\d+\\.\\d+)"
    post_install:
      - mkdir: "{{ paths.tmp }}/nodejs"
    size_estimate_mb: 90

  discover:
    match_files: [node.exe]
    version_command: "node.exe -v"
    version_regex: "v(\\d+\\.\\d+\\.\\d+)"

  update:
    policy: auto-patch
    retention: 1
    check_interval: 12h

  ui:
    color: "#5FA04E"
    actions:
      - { label: "Terminal com esta versão", icon: terminal, shell: { path_prepend: ["{{ paths.version }}"] } }
