# yaml-language-server: $schema=../schema/tool.v1.json
# verified: 2026-10-26 8.4.13 e9cd98b1d23f122987b1afca26ad942efec5891481103d48ae3cde237fa3ea54
#   (MySQL publishes only MD5 and GPG; sha256 computed locally from the file downloaded from
#   cdn.mysql.com. The same zip was extracted and run by scripts/validate-mysql-cs.ps1.)
#
# Case sensitivity (docs/15 section 5): the template mysql/my.ini.j2 sets
# lower_case_table_names=0 when the instance data dir is case-sensitive. Validated empirically
# on MySQL 8.4.13 / NTFS-CS (PASS), see docs/15 section 5. Never change on an initialized instance.
apiVersion: forgebox.dev/v1
kind: Tool

metadata:
  id: mysql
  name: MySQL
  summary: MySQL Community Server
  description: |
    MySQL Community Server 8.4 LTS. Várias instâncias (`default`, `legacy`...) com data dir,
    porta e `my.ini` próprios. Com o modo case-sensitive ligado, `lower_case_table_names=0`
    (paridade com Linux).
  category: database
  tags: [mysql, sql, database]
  homepage: https://dev.mysql.com
  docs: https://dev.mysql.com/doc/refman/8.4/en/
  license: GPL-2.0-only
  icon: mysql.svg
  maintainers: [{ name: Forgebox Team, url: https://github.com/forgebox }]

spec:
  platforms: [windows-x64]
  runtime_deps: [vcredist-vs17]

  versioning:
    scheme: semver
    channels:
      lts: { constraint: "~8.4" }
      innovation: { constraint: ">=9" }
    series_key: "{major}.{minor}"

  source:
    providers:
      - type: mysql
    releases:
      - version: "8.4.13"
        url: https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.13-winx64.zip
        sha256: "e9cd98b1d23f122987b1afca26ad942efec5891481103d48ae3cde237fa3ea54"
        size: 281154912

  install:
    archive: zip
    strip_root: auto
    layout: versioned
    current_link: true
    path:
      - "bin"
    shims: [mysql, mysqldump, mysqladmin]
    verify:
      command: "bin/mysqld.exe --version"
      regex: "Ver (\\d+\\.\\d+\\.\\d+)"
    post_install:
      - mkdir: "{{ paths.data }}/mysql"
      - mkdir: "{{ paths.tmp }}/mysql"   # pid files; per-instance folders (logs, my.ini) are made at start
    uninstall:
      keep: ["{{ paths.etc }}/mysql", "{{ paths.data }}/mysql"]
    size_estimate_mb: 620

  config:
    files:
      - id: my_ini
        path: "{{ paths.etc }}/mysql/{{ instance.name }}/my.ini"
        format: ini
        label: my.ini
        editable: true
    quick_settings:
      - key: max_connections
        label: Max connections
        file: my_ini
        ini: "mysqld.max_connections"
        type: number
        min: 1
        max: 100000
        default: 151
      - key: innodb_buffer_pool_size
        label: InnoDB buffer pool
        file: my_ini
        ini: "mysqld.innodb_buffer_pool_size"
        type: select
        options: [128M, 256M, 512M, 1G, 2G]
        default: 256M
      - key: max_allowed_packet
        label: Max allowed packet
        file: my_ini
        ini: "mysqld.max_allowed_packet"
        type: select
        options: [16M, 64M, 256M, 512M, 1G]
        default: 64M
        also_set: { "mysqldump.max_allowed_packet": "{{ value }}" }
      - key: innodb_flush_log_at_trx_commit
        label: Durabilidade (innodb_flush_log_at_trx_commit)
        file: my_ini
        ini: "mysqld.innodb_flush_log_at_trx_commit"
        type: select
        options: [0, 1, 2]
        default: 2

  service:
    kind: daemon
    daemon:
      multi_instance: true
      exe: bin/mysqld.exe
      args: ["--defaults-file={{ instance.config.my_ini }}", "--console"]
      cwd: "{{ paths.version }}"
      console_group: true
      ports:
        - { name: main, default: 3306, range: databases }
      check: { command: "bin/mysqld.exe --defaults-file={{ instance.config.my_ini }} --validate-config" }
      start_timeout: 60s
      health:
        tcp: "127.0.0.1:{{ instance.ports.main }}"
        interval: 5s
        success_threshold: 1
        failure_threshold: 3
      stop:
        command: "bin/mysqladmin.exe --protocol=tcp --host=127.0.0.1 --port={{ instance.ports.main }} -uroot shutdown"
        timeout: 30s
        then: ctrl-break
      restart_policy: { on: failure, max: 3, window: 60s }
      logs:
        - { label: Error log, path: "{{ paths.logs }}/mysql/{{ instance.name }}/error.log", format: mysql }
      data:
        dir: "{{ paths.data }}/mysql/{{ instance.name }}"
        init:
          command: "bin/mysqld.exe --defaults-file={{ instance.config.my_ini }} --initialize-insecure --console"
      autostart: true

  discover:
    match_files: [bin/mysqld.exe]
    version_command: "bin/mysqld.exe --version"
    version_regex: "Ver (\\d+\\.\\d+\\.\\d+)"

  update:
    policy: notify
    retention: 1
    check_interval: 12h

  ui:
    color: "#00758F"
    actions:
      - { label: "my.ini", icon: file-text, open: config:my_ini }
      - { label: "Cliente mysql", icon: terminal, shell: { path_prepend: ["{{ paths.version }}/bin"] } }
