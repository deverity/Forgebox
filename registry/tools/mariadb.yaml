# yaml-language-server: $schema=../schema/tool.v1.json
# verified: 2026-10-26 11.8.9 830c46727d9278eae212ae3eca44eeb9e71b2a68704e95f344a64fba7b1963f5
#   (REST API downloads.mariadb.org/rest-api/mariadb/11.8.9/ sha256sum == local hash of the zip
#   downloaded from archive.mariadb.org; the zip was also run by scripts/validate-mysql-cs.ps1)
#
# Case sensitivity (docs/15 section 5): mariadb/my.ini.j2 sets lower_case_table_names=0 when the
# data dir is case-sensitive. Validated empirically on MariaDB 11.8.9 / NTFS-CS (PASS).
apiVersion: forgebox.dev/v1
kind: Tool

metadata:
  id: mariadb
  name: MariaDB
  summary: MariaDB Server
  description: |
    MariaDB Server (série LTS 11.8). Várias instâncias com data dir, porta e `my.ini` próprios.
    Porta padrão 3307 para conviver com o MySQL na 3306.
  category: database
  tags: [mariadb, mysql, sql, database]
  homepage: https://mariadb.org
  docs: https://mariadb.com/kb/en/documentation/
  license: GPL-2.0-only
  icon: mariadb.svg
  maintainers: [{ name: Forgebox Team, url: https://github.com/forgebox }]

spec:
  platforms: [windows-x64]
  runtime_deps: [vcredist-vs17]

  versioning:
    scheme: semver
    channels:
      lts: { constraint: "~10.11 || ~11.4 || ~11.8 || ~12.3" }
      rolling: { constraint: ">=13" }
    series_key: "{major}.{minor}"

  source:
    providers:
      - type: mariadb
    releases:
      - version: "11.8.9"
        url: https://archive.mariadb.org/mariadb-11.8.9/winx64-packages/mariadb-11.8.9-winx64.zip
        sha256: "830c46727d9278eae212ae3eca44eeb9e71b2a68704e95f344a64fba7b1963f5"
        size: 97016251
        published_at: 2026-08-22T00:00:00Z

  install:
    archive: zip
    strip_root: auto
    layout: versioned
    current_link: true
    path:
      - "bin"
    shims: [mariadb, mariadb-dump, mariadb-admin]
    verify:
      command: "bin/mariadbd.exe --version"
      regex: "Ver (\\d+\\.\\d+\\.\\d+)"
    post_install:
      - mkdir: "{{ paths.data }}/mariadb"
      - mkdir: "{{ paths.logs }}/mariadb/{{ instance.name }}"
      - render: { template: "mariadb/my.ini.j2", to: "{{ paths.etc }}/mariadb/{{ instance.name }}/my.ini" }
    uninstall:
      keep: ["{{ paths.etc }}/mariadb", "{{ paths.data }}/mariadb"]
    size_estimate_mb: 400

  config:
    files:
      - id: my_ini
        path: "{{ paths.etc }}/mariadb/{{ instance.name }}/my.ini"
        format: ini
        label: my.ini
        editable: true
    quick_settings:
      - key: max_connections
        label: Max connections
        file: my_ini
        ini: "mysqld.max_connections"
        type: number
        min: 1
        max: 100000
        default: 151
      - key: innodb_buffer_pool_size
        label: InnoDB buffer pool
        file: my_ini
        ini: "mysqld.innodb_buffer_pool_size"
        type: select
        options: [128M, 256M, 512M, 1G, 2G]
        default: 256M
      - key: max_allowed_packet
        label: Max allowed packet
        file: my_ini
        ini: "mysqld.max_allowed_packet"
        type: select
        options: [16M, 64M, 256M, 512M, 1G]
        default: 64M
        also_set: { "mysqldump.max_allowed_packet": "{{ value }}" }
      - key: innodb_flush_log_at_trx_commit
        label: Durabilidade (innodb_flush_log_at_trx_commit)
        file: my_ini
        ini: "mysqld.innodb_flush_log_at_trx_commit"
        type: select
        options: [0, 1, 2]
        default: 2

  service:
    kind: daemon
    daemon:
      multi_instance: true
      exe: bin/mariadbd.exe
      args: ["--defaults-file={{ instance.config.my_ini }}", "--console"]
      cwd: "{{ paths.version }}"
      console_group: true
      ports:
        - { name: main, default: 3307, range: databases }
      start_timeout: 60s
      health:
        tcp: "127.0.0.1:{{ instance.ports.main }}"
        interval: 5s
        success_threshold: 1
        failure_threshold: 3
      stop:
        command: "bin/mariadb-admin.exe --protocol=tcp --host=127.0.0.1 --port={{ instance.ports.main }} -uroot shutdown"
        timeout: 30s
        then: ctrl-break
      restart_policy: { on: failure, max: 3, window: 60s }
      logs:
        - { label: Error log, path: "{{ paths.logs }}/mariadb/{{ instance.name }}/error.log", format: mysql }
      data:
        dir: "{{ paths.data }}/mariadb/{{ instance.name }}"
        init:
          command: "bin/mariadb-install-db.exe --datadir={{ instance.data_dir }} --port={{ instance.ports.main }} --silent"
      autostart: true

  discover:
    match_files: [bin/mariadbd.exe]
    version_command: "bin/mariadbd.exe --version"
    version_regex: "Ver (\\d+\\.\\d+\\.\\d+)"

  update:
    policy: notify
    retention: 1
    check_interval: 12h

  ui:
    color: "#C0765A"
    actions:
      - { label: "my.ini", icon: file-text, open: config:my_ini }
      - { label: "Cliente mariadb", icon: terminal, shell: { path_prepend: ["{{ paths.version }}/bin"] } }
