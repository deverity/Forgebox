name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, build, test, deny, registry, generated artifacts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace

      - name: deny
        run: cargo deny check

      - name: lint-registry
        run: cargo xtask lint-registry

      - name: generated artifacts are committed
        shell: bash
        run: |
          cargo xtask schema
          cargo xtask gen-ts
          git diff --exit-code

  desktop:
    name: desktop (pnpm build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: probe desktop app
        id: probe
        shell: bash
        run: |
          if [ -f apps/desktop/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.probe.outputs.present == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm -C apps/desktop install --frozen-lockfile
        if: steps.probe.outputs.present == 'true'

      - run: pnpm -C apps/desktop build
        if: steps.probe.outputs.present == 'true'
