# Mutating API methods with a `forge` command that no GUI action reaches (M2-E4-T5).
# `cli_only`: the method stays CLI-only on purpose; every entry needs a `reason`.
# `pending`: a screen of the named task will add the action; the entry is deleted then
#   (the Rust gate fails on a listed method that an action already reaches).
# The M2 gate (M2-E4-T11) runs with FORGE_PARITY_STRICT=1, where `pending` must be empty.
# Queries and streams (non-mutating methods) are exempt: they are not actions.
cli_only:
  - method: daemon.restart
    reason: "Daemon lifecycle: the GUI supervises the daemon itself (tray, shell); restarting it from a screen would cut its own connection."
  - method: daemon.stop
    reason: "Daemon lifecycle: the GUI quits through the shell (Sair), not through an action button."
  - method: remote.listen
    reason: "Remote access is a CLI-first feature in 1.x (docs/09 remote); no screen in M2."
  - method: remote.pair
    reason: "Remote pairing is a CLI-first feature in 1.x (docs/09 remote); no screen in M2."
  - method: remote.revoke
    reason: "Remote pairing is a CLI-first feature in 1.x (docs/09 remote); no screen in M2."
  - method: system.bundle_export
    reason: "Bundle export is an M3 feature (no GUI in M2)."
  - method: system.bundle_import
    reason: "Bundle import is an M3 feature (no GUI in M2)."
  - method: system.backup_now
    reason: "Backups are an M3 feature (no GUI in M2)."
  - method: system.backup_schedule
    reason: "Backups are an M3 feature (no GUI in M2)."
  - method: system.import_laragon
    reason: "Laragon import is an M3 feature (no GUI in M2)."
  - method: system.self_update
    reason: "Updating Forgebox itself is an M4 feature; the app updater ships inactive in 0.2.0."
  - method: sites.share
    reason: "Public tunnels (share) are an M6 feature."
  - method: net.lan_expose
    reason: "LAN exposure is an M3 feature (no GUI in M2)."
  - method: net.lan_unexpose
    reason: "LAN exposure is an M3 feature (no GUI in M2)."
  - method: sites.new
    reason: "Project scaffolding (forge new) is an M3 feature."
  - method: sites.park
    reason: "Parked folders are managed from the CLI in M2."
  - method: sites.unpark
    reason: "Parked folders are managed from the CLI in M2."
  - method: sites.alias
    reason: "Host aliases are edited in the site manifest in M2; no screen."
